<svg xmlns="http://www.w3.org/2000/svg" width="740" height="280" viewBox="70 80 740 280">
  <defs>
    <style>
      .solid-line { fill:none; stroke:#245A8D; stroke-width:3.2; }
      .dotted-line { fill:none; stroke:#7d8793; stroke-width:3.0; stroke-dasharray:8 8; }
      .diamond-solid { fill:#dcecff; stroke:#245A8D; stroke-width:2.8; }
      .diamond-dotted { fill:#ffffff; stroke:#7d8793; stroke-width:2.8; stroke-dasharray:6 5; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size:36px; fill:#20262d; }
      .subtle { font-family: Arial, Helvetica, sans-serif; font-size:19px; fill:#5e6873; }
    </style>
  </defs>

  <!-- Smooth trajectory: 5 tokens on a straight line -->
  <path class="solid-line" d="M120 185 L260 185 L400 185 L540 185 L680 185"/>
  <path class="dotted-line" d="M120 185 L260 112 L400 258 L540 108 L680 185"/>
  <polygon class="diamond-solid" points="120,167 138,185 120,203 102,185"/>
  <polygon class="diamond-solid" points="260,167 278,185 260,203 242,185"/>
  <polygon class="diamond-solid" points="400,167 418,185 400,203 382,185"/>
  <polygon class="diamond-solid" points="540,167 558,185 540,203 522,185"/>
  <polygon class="diamond-solid" points="680,167 698,185 680,203 662,185"/>

  <!-- High variation trajectory: 3 off-line tokens with dotted path -->
  <polygon class="diamond-dotted" points="260,94 278,112 260,130 242,112"/>
  <!-- polygon class="diamond-dotted" points="190,94 208,112 190,130 172,112"/ -->
  <polygon class="diamond-dotted" points="400,240 418,258 400,276 382,258"/>
  <polygon class="diamond-dotted" points="540,90 558,108 540,126 522,108"/>
  <!-- polygon class="diamond-dotted" points="610,90 628,108 610,126 592,108"/ -->

  <!-- Energy annotations -->
  <!-- text class="subtle" x="735" y="190">lower path energy</text>
  <text class="subtle" x="635" y="100">higher path energy</text -->

  <!-- Legend -->
  <polygon class="diamond-solid" points="130,306 154,330 130,354 106,330"/>
  <text class="label" x="160" y="337">smooth path</text>

  <polygon class="diamond-dotted" points="410,306 434,330 410,354 386,330"/>
  <text class="label" x="440" y="337">high variation path</text>
</svg>
