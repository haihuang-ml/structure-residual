<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="40 10 800 400">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#245A8D"/>
    </marker>
    <style>
      .token { fill:#ffffff; stroke:#20262d; stroke-width:2.4; }
      .boundary { fill:#dfe4ea; stroke:#20262d; stroke-width:2.4; }
      .target { fill:#dcecff; stroke:#245A8D; stroke-width:3.2; }
      .arrow { fill:none; stroke:#245A8D; stroke-width:2.7; marker-end:url(#arrow); }
      .label { font-family: Arial, Helvetica, sans-serif; font-size:36px; fill:#20262d; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size:36px; fill:#245A8D; }
      .bracket { fill:none; stroke:#20262d; stroke-width:2.2; }
    </style>
  </defs>

  <!-- token baseline -->
  <!-- segment 1 -->
  <circle class="token" cx="100" cy="190" r="18"/>
  <circle class="token" cx="160" cy="190" r="18"/>
  <circle class="token" cx="220" cy="190" r="18"/>
  <rect class="boundary" x="262" y="172" width="36" height="36" rx="2"/>

  <!-- segment 2 -->
  <circle class="token" cx="340" cy="190" r="18"/>
  <circle class="token" cx="400" cy="190" r="18"/>
  <circle class="token" cx="460" cy="190" r="18"/>
  <rect class="boundary" x="502" y="172" width="36" height="36" rx="2"/>

  <!-- segment 3 -->
  <circle class="token" cx="580" cy="190" r="18"/>
  <circle class="target" cx="640" cy="190" r="18"/>
  <circle class="token" cx="700" cy="190" r="18"/>
  <rect class="boundary" x="742" y="172" width="36" height="36" rx="2"/>

  <!-- attention arrows from target query (640,190) to visible predecessors -->
  <path class="arrow" d="M631 174 C650 70, 455 70, 286 168"/>
  <path class="arrow" d="M635 172 C670 105, 635 105, 526 168"/>
  <path class="arrow" d="M624 176 C690 135, 655 135, 598 170"/>

  <text class="small" x="493" y="68" text-anchor="middle">attend to</text>

  <!-- current segment underbrace -->
  <path class="bracket" d="M545 245 C545 260, 557 263, 570 263 L638 263 C648 263, 654 270, 658 282 C662 270, 668 263, 678 263 L755 263 C768 263, 780 260, 780 245"/>
  <text class="label" x="662" y="318" text-anchor="middle">current segment</text>

  <!-- tiny legend for token shapes -->
  <circle class="token" cx="140" cy="300" r="24"/>
  <text class="label" x="180" y="310">non-boundary</text>
  <rect class="boundary" x="116" y="350" width="48" height="48" rx="1"/>
  <text class="label" x="180" y="384">boundary</text>
</svg>
